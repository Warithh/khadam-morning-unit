<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f2f28">
  <title>خطة خدام الوحدة الصباحية</title>
  <meta name="description" content="توزيع واجبات خدام الوحدة الصباحية مع تقرير واتساب.">
  <style>
    @font-face {
      font-family: "Mada";
      src: url("fonts/Mada.ttf") format("truetype");
      font-weight: 200 900;
      font-style: normal;
      font-display: swap;
    }
    :root {
      --bg: #f2f5f3;
      --ink: #10231d;
      --muted: #4d635a;
      --line: #d5ddd8;
      --panel: #ffffff;
      --brand: #0f2f28;
      --brand-2: #1a6b52;
      --danger: #9b2c2c;
      --focus: #1a6b52;
      --shadow: 0 1px 0 rgba(16, 35, 29, .04), 0 18px 40px rgba(16, 35, 29, .06);
      --radius: 14px;
      --ease: cubic-bezier(.2, .8, .2, 1);
    }
    * { box-sizing: border-box; }
    html { height: 100%; }
    body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(1200px 480px at 100% -10%, rgba(26, 107, 82, .08), transparent 55%),
        var(--bg);
      color: var(--ink);
      font-family: "Mada", "Segoe UI", Tahoma, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      font-variant-numeric: tabular-nums;
    }
    ::selection { background: #c6e2d6; color: var(--ink); }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    h1, h2, p { margin: 0; }
    .app { width: min(1180px, calc(100% - 28px)); margin-inline: auto; padding-bottom: 64px; }
    .hero {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: end;
      padding: 28px 0 18px;
      flex-wrap: wrap;
    }
    .hero h1 {
      font-size: clamp(1.55rem, 2.4vw, 2rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
    }
    .hero .sub { margin-top: 6px; color: var(--muted); font-size: .98rem; }
    .datebox {
      display: grid;
      gap: 8px;
      color: var(--muted);
      font-size: .82rem;
      font-weight: 600;
    }
    .date-row { display: flex; gap: 8px; align-items: center; }
    input, select, textarea {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      min-height: 44px;
      padding: 10px 12px;
      min-width: 0;
      max-width: 100%;
    }
    select { width: 100%; }
    textarea {
      width: 100%;
      min-height: 440px;
      resize: vertical;
      line-height: 1.75;
      border-radius: 12px;
    }
    .icon-btn, .btn {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 12px;
      min-height: 44px;
      padding: 0 14px;
      transition: background .18s var(--ease), border-color .18s var(--ease), transform .12s var(--ease);
    }
    .icon-btn { width: 44px; padding: 0; font-size: 1.1rem; }
    .btn.primary { background: var(--brand); color: #f4faf7; border-color: var(--brand); }
    .btn.primary:hover { background: #164038; }
    .btn.primary.done { background: var(--brand-2); border-color: var(--brand-2); }
    .btn.ghost:hover, .icon-btn:hover { border-color: #b7c6bf; background: #f7faf8; }
    .btn:active, .icon-btn:active { transform: translateY(1px); }
    .btn.danger, .link-danger {
      background: transparent;
      border: 0;
      color: var(--danger);
      min-height: 40px;
      padding: 0 8px;
    }
    .meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
      flex-wrap: wrap;
      padding-bottom: 14px;
    }
    #day-label { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; }
    #stats { display: flex; flex-wrap: wrap; gap: 8px 16px; color: var(--muted); }
    #stats b { color: var(--ink); }
    .tabs {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      gap: 4px;
      padding: 4px;
      margin-bottom: 18px;
      background: rgba(242, 245, 243, .92);
      backdrop-filter: blur(10px);
      border: 1px solid var(--line);
      border-radius: 14px;
    }
    .tabs button {
      flex: 1;
      border: 0;
      background: transparent;
      min-height: 42px;
      border-radius: 10px;
      color: var(--muted);
      font-weight: 600;
    }
    .tabs button[aria-selected="true"] {
      background: var(--panel);
      color: var(--ink);
      box-shadow: var(--shadow);
    }
    .panel { display: none; }
    .panel.on { display: block; animation: rise .28s var(--ease); }
    @keyframes rise {
      from { opacity: .45; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    .grid {
      display: grid;
      gap: 18px;
      align-items: start;
    }
    @media (min-width: 980px) {
      .grid { grid-template-columns: minmax(0, 1.15fr) minmax(320px, .85fr); }
      .report { position: sticky; top: 76px; }
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
    }
    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .toolbar .grow { flex: 1 1 180px; }
    .site-block + .site-block { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
    .site-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: baseline;
      margin-bottom: 8px;
    }
    .site-head h2 { font-size: 1.02rem; font-weight: 700; }
    .pill {
      color: var(--muted);
      font-size: .82rem;
      font-weight: 700;
    }
    .pill.accent { color: var(--brand-2); }
    .roster { list-style: none; margin: 0; padding: 0; }
    .roster li {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr) minmax(150px, 220px);
      gap: 8px 10px;
      align-items: center;
      padding: 8px;
      border-radius: 12px;
    }
    .roster li:hover { background: #f5f8f6; }
    .idx { color: var(--muted); font-weight: 700; }
    .note { color: var(--muted); font-size: .9rem; margin-top: 2px; }
    .side-list { list-style: none; margin: 8px 0 0; padding: 0; }
    .side-list li { padding: 4px 0; color: var(--muted); }
    .report-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .report-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .live { min-height: 1.25em; margin-top: 10px; color: var(--brand-2); font-weight: 700; }
    .form-row {
      display: grid;
      grid-template-columns: 1.3fr .9fr 1.1fr auto;
      gap: 10px;
      align-items: end;
      margin-bottom: 14px;
    }
    label.field { display: grid; gap: 6px; color: var(--muted); font-size: .82rem; font-weight: 600; }
    .check {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      color: var(--ink);
      font-size: 1rem;
      font-weight: 500;
    }
    .person, .site-edit {
      padding: 14px 0;
      border-top: 1px solid var(--line);
    }
    .person {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) .8fr auto auto;
      gap: 8px 12px;
      align-items: end;
    }
    .person .span { grid-column: 1 / -1; }
    .site-edit { display: grid; gap: 10px; }
    .site-top {
      display: flex;
      gap: 12px;
      align-items: end;
      flex-wrap: wrap;
    }
    .site-top .field { flex: 1; min-width: 220px; }
    .zones { display: grid; gap: 8px; }
    .zone-line { display: flex; gap: 8px; }
    .zone-line input { flex: 1; }
    .error { color: var(--danger); font-weight: 700; margin: 0 0 10px; }
    .empty { color: var(--muted); padding: 12px 0; }
    #add-site { grid-template-columns: 1fr auto auto; }
    @media (max-width: 820px) {
      .form-row, #add-site, .person { grid-template-columns: 1fr; }
      .roster li { grid-template-columns: 28px minmax(0, 1fr); }
      .roster li select { grid-column: 1 / -1; }
      .report-actions {
        position: fixed;
        inset-inline: 0;
        bottom: 0;
        z-index: 8;
        background: var(--brand);
        padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
      }
      .report-actions .btn { flex: 1; }
      .report-actions .primary { background: #f4faf7; color: var(--brand); border-color: #f4faf7; }
      .report-actions .ghost { color: #f4faf7; border-color: #7ea897; background: transparent; }
      body { padding-bottom: 78px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .panel.on { animation: none; }
      .btn, .icon-btn { transition: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="hero">
      <div>
        <h1>الوحدة الصباحية</h1>
        <p class="sub">شعبة المنشآت الصحية — العتبة العلوية المقدسة</p>
      </div>
      <div class="datebox">
        التاريخ
        <div class="date-row">
          <button type="button" class="icon-btn" id="prev-day" aria-label="اليوم السابق">›</button>
          <input id="work-date" type="date">
          <button type="button" class="icon-btn" id="next-day" aria-label="اليوم التالي">‹</button>
        </div>
      </div>
    </header>

    <div class="meta">
      <p id="day-label"></p>
      <p id="stats"></p>
    </div>

    <nav class="tabs" id="nav" aria-label="الأقسام">
      <button type="button" data-tab="plan" aria-selected="true">التوزيع</button>
      <button type="button" data-tab="people" aria-selected="false">المنتسبون</button>
      <button type="button" data-tab="sites" aria-selected="false">المواقع</button>
    </nav>

    <main>
      <section id="panel-plan" class="panel on">
        <div class="grid">
          <section class="card">
            <div class="toolbar">
              <input class="grow" id="board-filter" type="search" placeholder="بحث" autocomplete="off">
              <button type="button" class="btn ghost" id="redistribute">إعادة توزيع اليوم</button>
              <button type="button" class="btn ghost" id="reset-seed">الأصل</button>
            </div>
            <div id="board"></div>
          </section>
          <section class="card report">
            <div class="report-head">
              <h2>التقرير</h2>
              <div class="report-actions">
                <button type="button" class="btn primary" id="copy-report">نسخ</button>
                <button type="button" class="btn ghost" id="rebuild-report">تحديث</button>
              </div>
            </div>
            <textarea id="report" dir="rtl" spellcheck="false" aria-label="نص التقرير"></textarea>
            <p class="live" id="copy-msg" aria-live="polite"></p>
          </section>
        </div>
      </section>

      <section id="panel-people" class="panel">
        <section class="card">
          <form id="add-person" class="form-row">
            <label class="field">الاسم<input name="name" required autocomplete="off"></label>
            <label class="field">الاستراحة<select name="rest"></select></label>
            <label class="field">موقع أساسي<select name="site"></select></label>
            <button class="btn primary" type="submit">إضافة</button>
          </form>
          <p id="add-error" class="error" hidden></p>
          <label class="field">بحث<input id="people-filter" autocomplete="off"></label>
          <div id="people-list"></div>
        </section>
      </section>

      <section id="panel-sites" class="panel">
        <section class="card">
          <form id="add-site" class="form-row">
            <label class="field">اسم الموقع<input name="title" required autocomplete="off"></label>
            <label class="check"><input name="fridayOnly" type="checkbox"> جمعة فقط</label>
            <button class="btn primary" type="submit">إضافة</button>
          </form>
          <p id="site-error" class="error" hidden></p>
          <div id="sites-list"></div>
        </section>
      </section>
    </main>
  </div>

  <script>
    const DAYS = [
      { id: "sat", name: "السبت" },
      { id: "sun", name: "الأحد" },
      { id: "mon", name: "الاثنين" },
      { id: "tue", name: "الثلاثاء" },
      { id: "wed", name: "الأربعاء" },
      { id: "thu", name: "الخميس" },
      { id: "fri", name: "الجمعة" }
    ];
    const DAY_NAME = Object.fromEntries(DAYS.map((d) => [d.id, d.name]));
    const STORE_KEY = "khadam-morning-unit-v4";

    function seed() {
      const zone = (id, label) => ({ id, label });
      const sites = [
        { id: "s4", title: "صحيات رقم (4)", fridayOnly: false, zones: [
          zone("s4a", "الممر رقم (1 - 2 - 3)"),
          zone("s4b", "الممر رقم (4 - 5 - 6)"),
          zone("s4c", "احواض الوضوء+الباحه"),
          zone("s4d", "المدخل +السلالم")
        ]},
        { id: "s5", title: "صحيات رقم (5)", fridayOnly: false, zones: [
          zone("s5a", "الممر رقم (1 - 2)"),
          zone("s5b", "الممر رقم (3 - 4 - 5)"),
          zone("s5c", "احواض الوضوء + الباحه"),
          zone("s5d", "المدخل + السلالم")
        ]},
        { id: "s7", title: "صحيات رقم 7 (السقايه)", fridayOnly: false, zones: [] },
        { id: "s8", title: "صحيات رقم 8 (شارع زين العابدين)", fridayOnly: false, zones: [] },
        { id: "s9", title: "صحيات رقم 9 (مجمع السجاد)", fridayOnly: false, zones: [] },
        { id: "s10", title: "صحيات رقم 10 (الرابطة)", fridayOnly: true, zones: [] },
        { id: "s11", title: "صحيات رقم 11 (المدرسه الغروية)", fridayOnly: false, zones: [] },
        { id: "s14", title: "صحيات رقم 14 (الخباطة)", fridayOnly: false, zones: [] },
        { id: "fatima", title: "صحيات صحن السيدة فاطمة ع", fridayOnly: false, zones: [] },
        { id: "farewell", title: "متنقلة التوديع", fridayOnly: false, zones: [] },
        { id: "garage", title: "متنقلة گراج ابوتراب", fridayOnly: true, zones: [] },
        { id: "murtada", title: "استراحة المرتضى", fridayOnly: true, zones: [] },
        { id: "ridha", title: "صحيات مدينة الإمام الرضا عليه السلام", fridayOnly: false, zones: [] }
      ];
      const person = (id, name, rest, site, zoneId, note) => ({
        id, name, rest, site, zone: zoneId || "", note: note || "", leave: false
      });
      const people = [
        person("p1", "عبد الهادي صادق", "tue", "s4", "s4a"),
        person("p2", "هاني عوده", "mon", "s4", "s4c"),
        person("p3", "علي احمد", "thu", "s4", "s4b"),
        person("p4", "محمد رضا", "tue", "s4", "s4d"),
        person("p5", "ريسان عبد", "mon", "s4", "s4c", "أحواض الوضوء باب الامام الحسين(ع)"),
        person("p6", "رضا عبد مسلم", "sat", "s5", "s5a"),
        person("p7", "احمد عدنان", "mon", "s5", "s5c", "صحيات جامع الشيخ الانصاري"),
        person("p8", "صاحب مهدي", "sat", "s5", "s5b"),
        person("p9", "عباس جبار", "thu", "s5", "s5c"),
        person("p10", "رسول عبد", "sun", "s5", "s5d"),
        person("p11", "سجاد يحيى", "wed", "s7", "", "زيارة صباحية"),
        person("p12", "عادل صادق", "wed", "s8"),
        person("p13", "فارس ضياء", "wed", "s8"),
        person("p14", "فلاح كامل", "sat", "s9"),
        person("p15", "سيف علي", "thu", "s9"),
        person("p16", "مصطفى محسن", "sun", "s10"),
        person("p17", "كرار حيدر", "wed", "s10"),
        person("p18", "هادي احمد", "tue", "s11"),
        person("p19", "حسنين عبد الاله", "sat", "s11", "", "غسل عام مع تنظيف المراوح"),
        person("p20", "حسين كاظم", "sun", "s14"),
        person("p21", "حسين سالم", "sun", "fatima", "", "رقم 16 قرب المضيف.. المجمع الإداري وقاعة العد والفرز …زيارة صباحية"),
        person("p22", "حيدر طه", "mon", "fatima", "", "رقم 18 قرب المنارة…زيارة صباحية"),
        person("p23", "عباس حسين", "tue", "fatima", "", "160+ قاعة امنه وجعفر الطيار"),
        person("p24", "حسن عبود", "sat", "fatima", "", "موقع الغسل"),
        person("p25", "مرتضى صلاح", "mon", "farewell"),
        person("p26", "باقر محمد", "thu", "garage", "", "استراحة الغدير ومتنزه المعلمين"),
        person("p27", "علي رزاق", "sat", "murtada"),
        person("p28", "محمد هلال", "sun", "ridha", "", "صحية رقم 6 …..الطابق الاول"),
        person("p29", "هاتف رحيم", "wed", "ridha", "", "صحية رقم 6 …..الطابق الاول"),
        person("p30", "مصطفى مشتاق", "mon", "ridha", "", "صحية رقم 6 …..الطابق الثاني"),
        person("p31", "كمال كاظم", "tue", "ridha", "", "صحية رقم 3 …..الطابق الاول…صحيات الورش قرب دار ابو طالب"),
        person("p32", "نبيل جاهل", "thu", "ridha", "", "صحية رقم 3 الطابق الثاني")
      ];
      return { sites, people, daily: {} };
    }

    let state = load();
    let reportDirty = false;
    let peopleQuery = "";
    let boardQuery = "";
    let armed = null;

    function load() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
        if (saved && Array.isArray(saved.people) && Array.isArray(saved.sites)) {
          saved.daily = saved.daily && typeof saved.daily === "object" ? saved.daily : {};
          saved.sites.forEach((site) => { site.zones = site.zones || []; });
          saved.people.forEach((person) => {
            person.zone = person.zone || "";
            person.note = person.note || "";
            person.leave = Boolean(person.leave);
            person.rest = person.rest || "";
            person.site = person.site || "";
          });
          return saved;
        }
      } catch (err) { /* الأصل */ }
      return seed();
    }
    function save() { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
    function todayISO() {
      const d = new Date();
      const z = (n) => String(n).padStart(2, "0");
      return d.getFullYear() + "-" + z(d.getMonth() + 1) + "-" + z(d.getDate());
    }
    function toISO(date) {
      const z = (n) => String(n).padStart(2, "0");
      return date.getFullYear() + "-" + z(date.getMonth() + 1) + "-" + z(date.getDate());
    }
    function parseISO(dateISO) {
      const parts = dateISO.split("-").map(Number);
      return new Date(parts[0], parts[1] - 1, parts[2]);
    }
    function weekdayId(dateISO) {
      return ["sun", "mon", "tue", "wed", "thu", "fri", "sat"][parseISO(dateISO).getDay()];
    }
    function shiftDate(iso, days) {
      const dt = parseISO(iso);
      dt.setDate(dt.getDate() + days);
      return toISO(dt);
    }
    function weekStartISO(dateISO) {
      const dt = parseISO(dateISO);
      const sinceSat = (dt.getDay() + 1) % 7;
      dt.setDate(dt.getDate() - sinceSat);
      return toISO(dt);
    }
    function weekDates(dateISO) {
      const start = weekStartISO(dateISO);
      return [0, 1, 2, 3, 4, 5, 6].map((n) => shiftDate(start, n));
    }
    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[ch]);
    }
    function siteById(id) { return state.sites.find((s) => s.id === id); }
    function personById(id) { return state.people.find((p) => p.id === id); }
    function nextId(prefix, list) {
      const nums = list.map((item) => Number(String(item.id).replace(/\D/g, "")) || 0);
      return prefix + (Math.max(0, ...nums) + 1);
    }
    function nameTaken(name, exceptId) {
      const key = name.trim();
      return state.people.some((person) => person.id !== exceptId && person.name.trim() === key);
    }
    function dayOptions(selected) {
      const head = `<option value=""${!selected ? " selected" : ""}>بلا استراحة</option>`;
      return head + DAYS.map((d) => `<option value="${d.id}"${d.id === selected ? " selected" : ""}>${d.name}</option>`).join("");
    }
    function siteOptions(selected, openOnlyDay) {
      const sites = state.sites.filter((s) => !openOnlyDay || !s.fridayOnly || openOnlyDay === "fri");
      return `<option value="">بانتظار موقع</option>` + sites.map((s) =>
        `<option value="${esc(s.id)}"${s.id === selected ? " selected" : ""}>${esc(s.title)}</option>`
      ).join("");
    }
    function openSitesFor(dateISO) {
      const day = weekdayId(dateISO);
      return state.sites.filter((s) => !s.fridayOnly || day === "fri");
    }
    function isOff(person, dateISO) {
      const day = weekdayId(dateISO);
      return Boolean(person.leave || person.rest === day);
    }
    function uniquePeople(list) {
      const seen = new Set();
      return list.filter((person) => {
        if (seen.has(person.id)) return false;
        seen.add(person.id);
        return true;
      });
    }
    function assignmentFor(dateISO, person) {
      const override = state.daily[dateISO] && state.daily[dateISO][person.id];
      if (override) return { siteId: override.siteId || "", zoneId: override.zoneId || "" };
      const openIds = new Set(openSitesFor(dateISO).map((s) => s.id));
      if (person.site && openIds.has(person.site)) return { siteId: person.site, zoneId: person.zone || "" };
      return { siteId: "", zoneId: "" };
    }
    function classify(dateISO) {
      const day = weekdayId(dateISO);
      const openSites = openSitesFor(dateISO);
      const openIds = new Set(openSites.map((s) => s.id));
      const bySite = new Map(openSites.map((s) => [s.id, []]));
      const rest = [];
      const leave = [];
      const waiting = [];
      uniquePeople(state.people).forEach((person) => {
        if (person.leave) { leave.push(person); return; }
        if (person.rest === day) { rest.push(person); return; }
        const { siteId, zoneId } = assignmentFor(dateISO, person);
        if (!siteId || !openIds.has(siteId)) { waiting.push(person); return; }
        bySite.get(siteId).push({ person, zoneId });
      });
      return { day, openSites, bySite, rest, leave, waiting };
    }
    function hashPick(seed, mod) {
      let h = 2166136261;
      for (let i = 0; i < seed.length; i += 1) {
        h ^= seed.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return Math.abs(h) % Math.max(mod, 1);
    }
    function sitesUsedInWeek(personId, dateISO) {
      const used = new Set();
      weekDates(dateISO).forEach((dayISO) => {
        if (dayISO === dateISO) return;
        const person = personById(personId);
        if (!person || isOff(person, dayISO)) return;
        const siteId = assignmentFor(dayISO, person).siteId;
        if (siteId) used.add(siteId);
      });
      return used;
    }
    function yesterdaySite(personId, dateISO) {
      const prev = shiftDate(dateISO, -1);
      if (weekStartISO(prev) !== weekStartISO(dateISO)) return "";
      const person = personById(personId);
      if (!person || isOff(person, prev)) return "";
      return assignmentFor(prev, person).siteId || "";
    }
    function redistributeDay(dateISO) {
      const openSites = openSitesFor(dateISO);
      const available = uniquePeople(state.people).filter((person) => !isOff(person, dateISO));
      const load = Object.fromEntries(openSites.map((site) => [site.id, 0]));
      const nextDaily = {};
      const ordered = available.slice().sort((a, b) => {
        const ha = hashPick(dateISO + a.id, 100000);
        const hb = hashPick(dateISO + b.id, 100000);
        return ha - hb || a.name.localeCompare(b.name, "ar");
      });
      ordered.forEach((person) => {
        const used = sitesUsedInWeek(person.id, dateISO);
        const ySite = yesterdaySite(person.id, dateISO);
        let candidates = openSites.filter((site) => !used.has(site.id));
        if (!candidates.length) candidates = openSites.slice();
        const fresh = candidates.filter((site) => site.id !== ySite);
        if (fresh.length) candidates = fresh;
        candidates.sort((a, b) => {
          const la = load[a.id] - load[b.id];
          if (la) return la;
          return hashPick(dateISO + person.id + a.id, 1000) - hashPick(dateISO + person.id + b.id, 1000);
        });
        const chosen = candidates[0];
        if (!chosen) return;
        load[chosen.id] += 1;
        const zoneOk = chosen.id === person.site && chosen.zones.some((zone) => zone.id === person.zone);
        nextDaily[person.id] = { siteId: chosen.id, zoneId: zoneOk ? person.zone : "" };
      });
      state.daily[dateISO] = nextDaily;
      save();
    }
    function ensureDayPlan(dateISO) {
      if (!state.daily[dateISO] || !Object.keys(state.daily[dateISO]).length) redistributeDay(dateISO);
    }
    function buildReport(dateISO) {
      const view = classify(dateISO);
      const lines = [
        "*بسم الله الرحمن الرحيم*",
        "*خطه عمل خدام الوحده الصباحية شعبة المنشآت الصحية*",
        "*... يوم " + DAY_NAME[view.day] + " " + dateISO.split("-").join("/") + " ...*",
        ""
      ];
      view.openSites.forEach((site) => {
        const rows = view.bySite.get(site.id) || [];
        if (!rows.length) return;
        lines.push("*" + site.title + "*");
        rows.forEach((row, index) => {
          lines.push((index + 1) + "-" + row.person.name + (row.person.note ? " … " + row.person.note : ""));
        });
        lines.push("");
      });
      if (view.waiting.length) {
        lines.push("*بانتظار تحديد موقع*");
        view.waiting.forEach((person, index) => lines.push((index + 1) + "-" + person.name));
        lines.push("");
      }
      const detailed = view.openSites.filter((site) => site.zones.length && (view.bySite.get(site.id) || []).some((row) => row.zoneId));
      if (detailed.length) {
        lines.push("*خطه توزيع المهام على المنتسبين*");
        lines.push("");
        detailed.forEach((site) => {
          lines.push("*" + site.title + "*");
          const rows = view.bySite.get(site.id) || [];
          site.zones.forEach((zone) => {
            const names = rows.filter((row) => row.zoneId === zone.id).map((row) => row.person.name);
            if (!names.length) return;
            lines.push("*" + zone.label + "*");
            lines.push(names.join(" + "));
          });
          lines.push("");
        });
      }
      return lines.join("\n").trim() + "\n";
    }
    function setReport(text, dirty) {
      document.getElementById("report").value = text;
      reportDirty = dirty;
    }
    function showTab(name) {
      document.querySelectorAll(".tabs button").forEach((tab) => {
        tab.setAttribute("aria-selected", String(tab.dataset.tab === name));
      });
      ["plan", "people", "sites"].forEach((id) => {
        document.getElementById("panel-" + id).classList.toggle("on", id === name);
      });
    }
    function matchesQuery(name, query) {
      const q = query.trim();
      return !q || name.includes(q);
    }
    function paintBoard() {
      const dateISO = document.getElementById("work-date").value;
      ensureDayPlan(dateISO);
      const view = classify(dateISO);
      document.getElementById("day-label").textContent = DAY_NAME[view.day] + "  " + dateISO.split("-").join("/");
      const working = [...view.bySite.values()].reduce((sum, rows) => sum + rows.length, 0);
      document.getElementById("stats").innerHTML = [
        ["دوام", working],
        ["استراحة", view.rest.length],
        ["إجازة", view.leave.length],
        ["بانتظار", view.waiting.length]
      ].map(([label, count]) => `<span>${label} <b>${count}</b></span>`).join("");

      const personRow = (person, index, selectedSite) => `
        <li>
          <span class="idx">${index + 1}</span>
          <div>
            <strong>${esc(person.name)}</strong>
            ${person.note ? `<div class="note">${esc(person.note)}</div>` : ""}
          </div>
          <select data-move="${esc(person.id)}" aria-label="موقع ${esc(person.name)}">${siteOptions(selectedSite, view.day)}</select>
        </li>`;

      const blocks = [];
      view.openSites.forEach((site) => {
        const rows = (view.bySite.get(site.id) || []).filter((row) => matchesQuery(row.person.name, boardQuery));
        if (!rows.length) return;
        const pill = site.fridayOnly ? `<span class="pill accent">جمعة</span>` : `<span class="pill">${rows.length}</span>`;
        blocks.push(`<section class="site-block">
          <div class="site-head"><h2>${esc(site.title)}</h2>${pill}</div>
          <ol class="roster">${rows.map((row, index) => personRow(row.person, index, site.id)).join("")}</ol>
        </section>`);
      });

      const waiting = view.waiting.filter((person) => matchesQuery(person.name, boardQuery));
      if (waiting.length) {
        blocks.push(`<section class="site-block">
          <div class="site-head"><h2>بانتظار موقع</h2><span class="pill">${waiting.length}</span></div>
          <ol class="roster">${waiting.map((person, index) => personRow(person, index, "")).join("")}</ol>
        </section>`);
      }
      if (view.rest.length) {
        const rest = view.rest.filter((person) => matchesQuery(person.name, boardQuery));
        if (rest.length) {
          blocks.push(`<section class="site-block">
            <div class="site-head"><h2>استراحة</h2><span class="pill">${rest.length}</span></div>
            <ul class="side-list">${rest.map((p) => `<li>${esc(p.name)}</li>`).join("")}</ul>
          </section>`);
        }
      }
      if (view.leave.length) {
        const leave = view.leave.filter((person) => matchesQuery(person.name, boardQuery));
        if (leave.length) {
          blocks.push(`<section class="site-block">
            <div class="site-head"><h2>إجازة</h2><span class="pill">${leave.length}</span></div>
            <ul class="side-list">${leave.map((p) => `<li>${esc(p.name)}</li>`).join("")}</ul>
          </section>`);
        }
      }

      document.getElementById("board").innerHTML = blocks.join("") || `<p class="empty">لا نتائج</p>`;
      if (!reportDirty) setReport(buildReport(dateISO), false);
    }
    function paintPeople() {
      armed = null;
      const matched = state.people.filter((person) => matchesQuery(person.name, peopleQuery));
      document.getElementById("people-list").innerHTML = matched.length
        ? matched.map((person) => `
          <form class="person" data-person="${esc(person.id)}">
            <label class="field">الاسم<input name="name" value="${esc(person.name)}" required autocomplete="off"></label>
            <label class="field">الاستراحة<select name="rest">${dayOptions(person.rest)}</select></label>
            <label class="check"><input name="leave" type="checkbox"${person.leave ? " checked" : ""}> مجاز</label>
            <button type="button" class="link-danger" data-delete-person="${esc(person.id)}">حذف</button>
            <label class="field span">ملاحظة<input name="note" value="${esc(person.note)}" autocomplete="off"></label>
          </form>`).join("")
        : `<p class="empty">لا نتائج</p>`;
      const addRest = document.querySelector("#add-person select[name=rest]");
      const addSite = document.querySelector("#add-person select[name=site]");
      const keepSite = addSite.value;
      if (!addRest.options.length) addRest.innerHTML = dayOptions("");
      addSite.innerHTML = siteOptions(keepSite);
    }
    function paintSites() {
      armed = null;
      document.getElementById("sites-list").innerHTML = state.sites.map((site) => {
        const zones = (site.zones || []).map((zone) => `
          <div class="zone-line">
            <input data-zone-label="${esc(site.id)}" data-zone="${esc(zone.id)}" value="${esc(zone.label)}" aria-label="تفصيلة">
            <button type="button" class="link-danger" data-delete-zone="${esc(site.id)}" data-zone="${esc(zone.id)}">حذف</button>
          </div>`).join("");
        return `<form class="site-edit" data-site="${esc(site.id)}">
          <div class="site-top">
            <label class="field">الموقع<input name="title" value="${esc(site.title)}" required></label>
            <label class="check"><input name="fridayOnly" type="checkbox"${site.fridayOnly ? " checked" : ""}> جمعة فقط</label>
          </div>
          <div class="zones">
            ${zones}
            <button type="button" class="btn ghost" data-add-zone="${esc(site.id)}">تفصيلة</button>
          </div>
          <button type="button" class="link-danger" data-delete-site="${esc(site.id)}">حذف الموقع</button>
        </form>`;
      }).join("") || `<p class="empty">لا مواقع</p>`;
    }
    function refreshAll() { paintPeople(); paintSites(); paintBoard(); }
    function applyDate(dateISO, opts) {
      const options = opts || {};
      dateInput.value = dateISO || todayISO();
      boardQuery = "";
      document.getElementById("board-filter").value = "";
      if (options.forceRedistribute) redistributeDay(dateInput.value);
      else ensureDayPlan(dateInput.value);
      reportDirty = false;
      setReport(buildReport(dateInput.value), false);
      paintBoard();
      document.getElementById("copy-msg").textContent = options.message || "";
    }
    function commitPeopleForm(form) {
      const person = personById(form.dataset.person);
      if (!person) return;
      const name = form.name.value.trim();
      if (!name) { form.name.value = person.name; return; }
      if (nameTaken(name, person.id)) {
        form.name.setCustomValidity("الاسم موجود");
        form.name.reportValidity();
        form.name.value = person.name;
        form.name.setCustomValidity("");
        return;
      }
      person.name = name;
      person.rest = form.rest.value;
      person.leave = form.leave.checked;
      person.note = form.note.value.trim();
      save();
      paintBoard();
    }
    function wantsConfirm(button, label) {
      if (armed && armed.button === button) { armed = null; return true; }
      if (armed) armed.button.textContent = armed.label;
      armed = { button, label: button.textContent };
      button.textContent = label;
      return false;
    }

    const dateInput = document.getElementById("work-date");
    dateInput.value = todayISO();
    dateInput.addEventListener("change", () => applyDate(dateInput.value || todayISO()));
    document.getElementById("prev-day").addEventListener("click", () => {
      applyDate(shiftDate(dateInput.value || todayISO(), -1));
    });
    document.getElementById("next-day").addEventListener("click", () => {
      applyDate(shiftDate(dateInput.value || todayISO(), 1), {
        forceRedistribute: true,
        message: "وُزّع الجميع على مواقع جديدة بلا تكرار في الأسبوع."
      });
    });
    document.getElementById("redistribute").addEventListener("click", () => {
      redistributeDay(dateInput.value);
      reportDirty = false;
      setReport(buildReport(dateInput.value), false);
      paintBoard();
      document.getElementById("copy-msg").textContent = "أُعيد توزيع هذا اليوم.";
    });
    document.getElementById("nav").addEventListener("click", (event) => {
      const button = event.target.closest("button[data-tab]");
      if (button) showTab(button.dataset.tab);
    });
    document.getElementById("board-filter").addEventListener("input", (event) => {
      boardQuery = event.target.value;
      paintBoard();
    });
    document.getElementById("board").addEventListener("change", (event) => {
      const select = event.target.closest("select[data-move]");
      if (!select) return;
      const person = personById(select.dataset.move);
      if (!person) return;
      const dateISO = dateInput.value;
      const nextSite = select.value;
      const site = siteById(nextSite);
      const zoneOk = site && site.zones.some((zone) => zone.id === person.zone);
      state.daily[dateISO] = state.daily[dateISO] || {};
      state.daily[dateISO][person.id] = {
        siteId: nextSite,
        zoneId: zoneOk ? person.zone : ""
      };
      save();
      paintBoard();
    });
    document.getElementById("report").addEventListener("input", () => { reportDirty = true; });
    document.getElementById("rebuild-report").addEventListener("click", () => {
      setReport(buildReport(dateInput.value), false);
      document.getElementById("copy-msg").textContent = "حُدّث التقرير.";
    });
    document.getElementById("copy-report").addEventListener("click", async () => {
      const button = document.getElementById("copy-report");
      const msg = document.getElementById("copy-msg");
      try {
        await navigator.clipboard.writeText(document.getElementById("report").value);
        button.classList.add("done");
        button.textContent = "تم";
        msg.textContent = "جاهز للصق في الواتساب.";
        setTimeout(() => { button.classList.remove("done"); button.textContent = "نسخ"; }, 1400);
      } catch (err) {
        document.getElementById("report").focus();
        document.getElementById("report").select();
        msg.textContent = "حدّد النص وانسخه يدوياً.";
      }
    });
    document.getElementById("reset-seed").addEventListener("click", (event) => {
      if (!wantsConfirm(event.currentTarget, "تأكيد؟")) return;
      state = seed();
      reportDirty = false;
      peopleQuery = "";
      boardQuery = "";
      document.getElementById("people-filter").value = "";
      document.getElementById("board-filter").value = "";
      save();
      applyDate(dateInput.value || todayISO(), { forceRedistribute: true, message: "رجعت الخطة الأصلية." });
      event.currentTarget.textContent = "الأصل";
    });

    document.getElementById("people-filter").addEventListener("input", (event) => {
      peopleQuery = event.target.value;
      const start = event.target.selectionStart;
      paintPeople();
      const filter = document.getElementById("people-filter");
      filter.value = peopleQuery;
      filter.focus();
      filter.setSelectionRange(start, start);
    });
    document.getElementById("add-person").addEventListener("submit", (event) => {
      event.preventDefault();
      const form = event.target;
      const error = document.getElementById("add-error");
      const name = form.name.value.trim();
      if (!name) { error.hidden = false; error.textContent = "اكتب الاسم."; return; }
      if (nameTaken(name)) { error.hidden = false; error.textContent = "الاسم موجود."; return; }
      error.hidden = true;
      state.people.push({
        id: nextId("p", state.people),
        name,
        rest: form.rest.value,
        site: form.site.value,
        zone: "",
        note: "",
        leave: false
      });
      form.reset();
      form.querySelector("select[name=rest]").innerHTML = dayOptions("");
      save();
      refreshAll();
    });
    document.getElementById("people-list").addEventListener("change", (event) => {
      const form = event.target.closest("form[data-person]");
      if (form) commitPeopleForm(form);
    });
    document.getElementById("people-list").addEventListener("focusout", (event) => {
      const form = event.target.closest("form[data-person]");
      if (form && (event.target.name === "name" || event.target.name === "note")) commitPeopleForm(form);
    });
    document.getElementById("people-list").addEventListener("click", (event) => {
      const button = event.target.closest("[data-delete-person]");
      if (!button || !wantsConfirm(button, "تأكيد؟")) return;
      state.people = state.people.filter((item) => item.id !== button.dataset.deletePerson);
      save();
      refreshAll();
    });

    document.getElementById("add-site").addEventListener("submit", (event) => {
      event.preventDefault();
      const form = event.target;
      const error = document.getElementById("site-error");
      const title = form.title.value.trim();
      if (!title) { error.hidden = false; error.textContent = "اكتب اسم الموقع."; return; }
      error.hidden = true;
      state.sites.push({
        id: nextId("s", state.sites),
        title,
        fridayOnly: form.fridayOnly.checked,
        zones: []
      });
      form.reset();
      save();
      refreshAll();
    });
    document.getElementById("sites-list").addEventListener("change", (event) => {
      const form = event.target.closest("form[data-site]");
      if (!form) return;
      const site = siteById(form.dataset.site);
      if (!site) return;
      if (event.target.name === "title") site.title = form.title.value.trim() || site.title;
      if (event.target.name === "fridayOnly") site.fridayOnly = form.fridayOnly.checked;
      save();
      paintBoard();
    });
    document.getElementById("sites-list").addEventListener("focusout", (event) => {
      const input = event.target.closest("[data-zone-label]");
      if (!input) return;
      const site = siteById(input.dataset.zoneLabel);
      const zone = site && site.zones.find((item) => item.id === input.dataset.zone);
      if (!zone) return;
      zone.label = input.value.trim() || zone.label;
      input.value = zone.label;
      save();
      paintBoard();
    });
    document.getElementById("sites-list").addEventListener("click", (event) => {
      const add = event.target.closest("[data-add-zone]");
      if (add) {
        const site = siteById(add.dataset.addZone);
        site.zones.push({ id: nextId(site.id + "z", site.zones), label: "تفصيلة جديدة" });
        save();
        refreshAll();
        return;
      }
      const zoneButton = event.target.closest("[data-delete-zone]");
      if (zoneButton) {
        if (!wantsConfirm(zoneButton, "تأكيد؟")) return;
        const site = siteById(zoneButton.dataset.deleteZone);
        site.zones = site.zones.filter((zone) => zone.id !== zoneButton.dataset.zone);
        state.people.forEach((person) => {
          if (person.zone === zoneButton.dataset.zone) person.zone = "";
        });
        save();
        refreshAll();
        return;
      }
      const siteButton = event.target.closest("[data-delete-site]");
      if (!siteButton || !wantsConfirm(siteButton, "تأكيد؟")) return;
      const site = siteById(siteButton.dataset.deleteSite);
      state.sites = state.sites.filter((item) => item.id !== site.id);
      state.people.forEach((person) => {
        if (person.site === site.id) { person.site = ""; person.zone = ""; }
      });
      Object.keys(state.daily).forEach((day) => {
        Object.keys(state.daily[day] || {}).forEach((pid) => {
          if (state.daily[day][pid].siteId === site.id) state.daily[day][pid] = { siteId: "", zoneId: "" };
        });
      });
      save();
      refreshAll();
    });
    document.addEventListener("click", (event) => {
      if (!armed || event.target === armed.button) return;
      armed.button.textContent = armed.label;
      armed = null;
    });

    ensureDayPlan(dateInput.value);
    refreshAll();
    window.__khadam = {
      classify,
      buildReport,
      redistributeDay,
      sitesUsedInWeek,
      weekStartISO,
      shiftDate,
      STORE_KEY,
      getState: () => state
    };
  </script>
</body>
</html>
