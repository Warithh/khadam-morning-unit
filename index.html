<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c2a24">
  <title>خطة خدام الوحدة الصباحية</title>
  <meta name="description" content="توزيع واجبات خدام الوحدة الصباحية مع تقرير واتساب.">
  <style>
    @font-face {
      font-family: "Mada";
      src: url("fonts/Mada.ttf") format("truetype");
      font-weight: 200 900;
      font-style: normal;
      font-display: swap;
    }
    :root {
      --bg: #eef2f0;
      --bg-soft: #f7f9f8;
      --ink: #0e1f1a;
      --muted: #5a6f66;
      --line: #d0dbd5;
      --line-strong: #b7c6bf;
      --panel: #ffffff;
      --brand: #0c2a24;
      --brand-mid: #145043;
      --brand-soft: #e4f0eb;
      --accent: #1a6b52;
      --danger: #9b2c2c;
      --danger-soft: #f8ecec;
      --shadow: 0 1px 2px rgba(14, 31, 26, .04), 0 12px 28px rgba(14, 31, 26, .06);
      --radius: 16px;
      --radius-sm: 10px;
      --space: 8px;
      --ease: cubic-bezier(.22, .8, .24, 1);
      --tap: 44px;
    }
    * { box-sizing: border-box; }
    html { height: 100%; }
    body {
      margin: 0;
      min-height: 100%;
      color: var(--ink);
      font-family: "Mada", "Segoe UI", Tahoma, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      font-variant-numeric: tabular-nums;
      background:
        linear-gradient(180deg, #dfeae4 0%, transparent 220px),
        radial-gradient(900px 360px at 100% 0%, rgba(26, 107, 82, .09), transparent 60%),
        var(--bg);
    }
    ::selection { background: #c7e4d7; color: var(--ink); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    h1, h2, h3, p { margin: 0; }
    .app {
      width: min(1120px, calc(100% - 32px));
      margin-inline: auto;
      padding: 24px 0 72px;
    }

    /* Header */
    .topbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .brand { min-width: min(100%, 280px); }
    .brand h1 {
      font-size: clamp(1.7rem, 3vw, 2.15rem);
      font-weight: 800;
      letter-spacing: -0.035em;
      line-height: 1.1;
      color: var(--brand);
    }
    .brand p {
      margin-top: 6px;
      color: var(--muted);
      font-size: .95rem;
      font-weight: 500;
    }
    .date-control {
      display: grid;
      gap: 6px;
      justify-items: stretch;
    }
    .date-control > span {
      color: var(--muted);
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .02em;
    }
    .date-nav {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 4px;
      box-shadow: var(--shadow);
    }
    .date-nav input[type="date"] {
      border: 0;
      background: transparent;
      min-height: var(--tap);
      padding: 0 10px;
      min-width: 150px;
    }
    .icon-btn {
      width: var(--tap);
      height: var(--tap);
      border: 0;
      border-radius: 11px;
      background: transparent;
      color: var(--ink);
      font-size: 1.2rem;
      line-height: 1;
      transition: background .15s var(--ease);
    }
    .icon-btn:hover { background: var(--bg-soft); }

    /* Day strip */
    .daystrip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .day-title {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .metrics {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .metric {
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
      min-height: 36px;
      padding: 0 12px;
      border-radius: 999px;
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: .86rem;
      font-weight: 600;
    }
    .metric b {
      color: var(--ink);
      font-size: .98rem;
      font-weight: 800;
    }
    .metric.warn { background: #fff8e8; border-color: #f0dfb0; color: #7a5b12; }
    .metric.warn b { color: #6a4d0c; }

    /* Tabs */
    .tabs {
      position: sticky;
      top: 0;
      z-index: 6;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      padding: 4px;
      margin-bottom: 18px;
      background: rgba(238, 242, 240, .88);
      backdrop-filter: blur(12px);
      border: 1px solid var(--line);
      border-radius: 14px;
    }
    .tabs button {
      border: 0;
      background: transparent;
      min-height: 44px;
      border-radius: 10px;
      color: var(--muted);
      font-weight: 700;
      transition: background .15s var(--ease), color .15s var(--ease), box-shadow .15s var(--ease);
    }
    .tabs button[aria-selected="true"] {
      background: var(--panel);
      color: var(--brand);
      box-shadow: var(--shadow);
    }

    .panel { display: none; }
    .panel.on { display: block; animation: rise .24s var(--ease); }
    @keyframes rise {
      from { opacity: .4; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }

    /* Layout */
    .layout {
      display: grid;
      gap: 18px;
      align-items: start;
    }
    @media (min-width: 980px) {
      .layout { grid-template-columns: minmax(0, 1.2fr) minmax(300px, .8fr); }
      .report-card { position: sticky; top: 78px; }
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .card-pad { padding: 16px; }
    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: var(--bg-soft);
    }
    .card-head h2 {
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: -0.01em;
    }
    .card-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    /* Controls */
    input, select, textarea {
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      min-height: var(--tap);
      padding: 10px 12px;
      min-width: 0;
      max-width: 100%;
      transition: border-color .15s var(--ease), box-shadow .15s var(--ease);
    }
    input:hover, select:hover, textarea:hover { border-color: var(--line-strong); }
    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(26, 107, 82, .12);
      outline: none;
    }
    textarea {
      min-height: 420px;
      resize: vertical;
      line-height: 1.75;
      border-radius: 12px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: var(--radius-sm);
      min-height: var(--tap);
      padding: 0 16px;
      font-weight: 700;
      white-space: nowrap;
      transition: background .15s var(--ease), border-color .15s var(--ease), color .15s var(--ease), transform .1s var(--ease);
    }
    .btn:active { transform: translateY(1px); }
    .btn.primary {
      background: var(--brand);
      border-color: var(--brand);
      color: #f3faf7;
    }
    .btn.primary:hover { background: var(--brand-mid); border-color: var(--brand-mid); }
    .btn.primary.done {
      background: var(--accent);
      border-color: var(--accent);
    }
    .btn.ghost:hover {
      background: var(--bg-soft);
      border-color: var(--line-strong);
    }
    .btn.soft {
      background: var(--brand-soft);
      border-color: #c5ddd2;
      color: var(--brand-mid);
    }
    .btn.soft:hover { background: #d5e8e0; }
    .btn.danger-text, .link-danger {
      border: 0;
      background: transparent;
      color: var(--danger);
      min-height: 40px;
      padding: 0 8px;
      font-weight: 700;
    }
    .btn.danger-text:hover, .link-danger:hover { background: var(--danger-soft); border-radius: 8px; }

    .search {
      flex: 1 1 200px;
      position: relative;
    }
    .search input { padding-inline-start: 14px; }

    /* Board */
    .site-block + .site-block {
      margin-top: 4px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }
    .site-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .site-head h3 {
      font-size: 1.02rem;
      font-weight: 800;
      letter-spacing: -0.01em;
    }
    .count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      height: 28px;
      padding: 0 8px;
      border-radius: 999px;
      background: var(--bg);
      color: var(--muted);
      font-size: .8rem;
      font-weight: 800;
    }
    .count.accent {
      background: var(--brand-soft);
      color: var(--accent);
    }
    .roster {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 4px;
    }
    .roster li {
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr) minmax(160px, 220px);
      gap: 8px 12px;
      align-items: center;
      padding: 10px 10px;
      border-radius: 12px;
      transition: background .12s var(--ease);
    }
    .roster li:hover { background: var(--bg-soft); }
    .idx {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: var(--bg);
      color: var(--muted);
      font-size: .82rem;
      font-weight: 800;
    }
    .person-name { font-weight: 700; }
    .note {
      margin-top: 2px;
      color: var(--muted);
      font-size: .86rem;
      line-height: 1.4;
    }
    .side-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 6px;
    }
    .side-list li {
      padding: 8px 10px;
      border-radius: 10px;
      background: var(--bg-soft);
      color: var(--muted);
      font-weight: 600;
    }
    .live {
      min-height: 1.3em;
      margin-top: 10px;
      color: var(--accent);
      font-size: .9rem;
      font-weight: 700;
    }
    .empty {
      color: var(--muted);
      padding: 28px 8px;
      text-align: center;
      font-weight: 600;
    }
    .error {
      color: var(--danger);
      font-weight: 700;
      margin: 0 0 12px;
      padding: 10px 12px;
      background: var(--danger-soft);
      border-radius: 10px;
    }

    /* Admin forms */
    .form-grid {
      display: grid;
      grid-template-columns: 1.3fr .85fr 1.1fr auto;
      gap: 10px;
      align-items: end;
    }
    .form-grid.sites {
      grid-template-columns: 1fr auto auto;
    }
    .field {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: .78rem;
      font-weight: 700;
    }
    .check {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: var(--tap);
      color: var(--ink);
      font-size: .95rem;
      font-weight: 600;
    }
    .check input {
      width: 18px;
      height: 18px;
      min-height: 0;
      accent-color: var(--accent);
    }
    .section-gap { margin-top: 16px; }
    .list-divider {
      border: 0;
      border-top: 1px solid var(--line);
      margin: 0;
    }
    .person-card, .site-card {
      padding: 16px 0;
      border-top: 1px solid var(--line);
    }
    .person-card:first-child, .site-card:first-child { border-top: 0; padding-top: 4px; }
    .person-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) .85fr auto auto;
      gap: 10px 12px;
      align-items: end;
    }
    .person-grid .span { grid-column: 1 / -1; }
    .site-top {
      display: flex;
      gap: 12px;
      align-items: end;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .site-top .field { flex: 1; min-width: 220px; }
    .zones { display: grid; gap: 8px; }
    .zone-line { display: flex; gap: 8px; align-items: center; }
    .zone-line input { flex: 1; }
    .site-footer {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    @media (max-width: 860px) {
      .app { width: min(100% - 20px, 1120px); padding-top: 16px; }
      .form-grid, .form-grid.sites, .person-grid {
        grid-template-columns: 1fr;
      }
      .roster li {
        grid-template-columns: 32px minmax(0, 1fr);
      }
      .roster li select { grid-column: 1 / -1; }
      .card-actions.dock {
        position: fixed;
        inset-inline: 0;
        bottom: 0;
        z-index: 8;
        background: var(--brand);
        padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
        border-radius: 0;
      }
      .card-actions.dock .btn { flex: 1; }
      .card-actions.dock .primary {
        background: #f4faf7;
        color: var(--brand);
        border-color: #f4faf7;
      }
      .card-actions.dock .ghost {
        color: #f4faf7;
        border-color: #6f9788;
        background: transparent;
      }
      body { padding-bottom: 84px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .panel.on { animation: none; }
      .btn, .icon-btn, .tabs button, .roster li { transition: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <h1>الوحدة الصباحية</h1>
        <p>شعبة المنشآت الصحية — العتبة العلوية المقدسة</p>
      </div>
      <div class="date-control">
        <span>التاريخ</span>
        <div class="date-nav">
          <button type="button" class="icon-btn" id="prev-day" aria-label="اليوم السابق">›</button>
          <input id="work-date" type="date">
          <button type="button" class="icon-btn" id="next-day" aria-label="اليوم التالي">‹</button>
        </div>
      </div>
    </header>

    <div class="daystrip">
      <p class="day-title" id="day-label"></p>
      <div class="metrics" id="stats"></div>
    </div>

    <nav class="tabs" id="nav" aria-label="الأقسام">
      <button type="button" data-tab="plan" aria-selected="true">التوزيع</button>
      <button type="button" data-tab="people" aria-selected="false">المنتسبون</button>
      <button type="button" data-tab="sites" aria-selected="false">المواقع</button>
    </nav>

    <main>
      <section id="panel-plan" class="panel on">
        <div class="layout">
          <section class="card">
            <div class="card-head">
              <h2>لوحة التوزيع</h2>
              <div class="card-actions">
                <div class="search">
                  <input id="board-filter" type="search" placeholder="بحث عن منتسب" autocomplete="off">
                </div>
                <button type="button" class="btn soft" id="redistribute">إعادة توزيع</button>
                <button type="button" class="btn ghost" id="reset-seed">الأصل</button>
              </div>
            </div>
            <div class="card-pad" id="board"></div>
          </section>

          <section class="card report-card">
            <div class="card-head">
              <h2>تقرير واتساب</h2>
              <div class="card-actions dock">
                <button type="button" class="btn primary" id="copy-report">نسخ</button>
                <button type="button" class="btn ghost" id="rebuild-report">تحديث</button>
              </div>
            </div>
            <div class="card-pad">
              <textarea id="report" dir="rtl" spellcheck="false" aria-label="نص التقرير"></textarea>
              <p class="live" id="copy-msg" aria-live="polite"></p>
            </div>
          </section>
        </div>
      </section>

      <section id="panel-people" class="panel">
        <section class="card">
          <div class="card-head">
            <h2>المنتسبون</h2>
          </div>
          <div class="card-pad">
            <form id="add-person" class="form-grid">
              <label class="field">الاسم<input name="name" required autocomplete="off"></label>
              <label class="field">الاستراحة<select name="rest"></select></label>
              <label class="field">موقع أساسي<select name="site"></select></label>
              <button class="btn primary" type="submit">إضافة</button>
            </form>
            <p id="add-error" class="error" hidden></p>
            <div class="section-gap">
              <label class="field">بحث<input id="people-filter" type="search" autocomplete="off" placeholder="ابحث بالاسم"></label>
            </div>
            <div id="people-list" class="section-gap"></div>
          </div>
        </section>
      </section>

      <section id="panel-sites" class="panel">
        <section class="card">
          <div class="card-head">
            <h2>المواقع</h2>
          </div>
          <div class="card-pad">
            <form id="add-site" class="form-grid sites">
              <label class="field">اسم الموقع<input name="title" required autocomplete="off"></label>
              <label class="check"><input name="fridayOnly" type="checkbox"> جمعة فقط</label>
              <button class="btn primary" type="submit">إضافة</button>
            </form>
            <p id="site-error" class="error" hidden></p>
            <div id="sites-list" class="section-gap"></div>
          </div>
        </section>
      </section>
    </main>
  </div>

  <script>
    const DAYS = [
      { id: "sat", name: "السبت" },
      { id: "sun", name: "الأحد" },
      { id: "mon", name: "الاثنين" },
      { id: "tue", name: "الثلاثاء" },
      { id: "wed", name: "الأربعاء" },
      { id: "thu", name: "الخميس" },
      { id: "fri", name: "الجمعة" }
    ];
    const DAY_NAME = Object.fromEntries(DAYS.map((d) => [d.id, d.name]));
    const STORE_KEY = "khadam-morning-unit-v4";

    function seed() {
      const zone = (id, label) => ({ id, label });
      const sites = [
        { id: "s4", title: "صحيات رقم (4)", fridayOnly: false, zones: [
          zone("s4a", "الممر رقم (1 - 2 - 3)"),
          zone("s4b", "الممر رقم (4 - 5 - 6)"),
          zone("s4c", "احواض الوضوء+الباحه"),
          zone("s4d", "المدخل +السلالم")
        ]},
        { id: "s5", title: "صحيات رقم (5)", fridayOnly: false, zones: [
          zone("s5a", "الممر رقم (1 - 2)"),
          zone("s5b", "الممر رقم (3 - 4 - 5)"),
          zone("s5c", "احواض الوضوء + الباحه"),
          zone("s5d", "المدخل + السلالم")
        ]},
        { id: "s7", title: "صحيات رقم 7 (السقايه)", fridayOnly: false, zones: [] },
        { id: "s8", title: "صحيات رقم 8 (شارع زين العابدين)", fridayOnly: false, zones: [] },
        { id: "s9", title: "صحيات رقم 9 (مجمع السجاد)", fridayOnly: false, zones: [] },
        { id: "s10", title: "صحيات رقم 10 (الرابطة)", fridayOnly: true, zones: [] },
        { id: "s11", title: "صحيات رقم 11 (المدرسه الغروية)", fridayOnly: false, zones: [] },
        { id: "s14", title: "صحيات رقم 14 (الخباطة)", fridayOnly: false, zones: [] },
        { id: "fatima", title: "صحيات صحن السيدة فاطمة ع", fridayOnly: false, zones: [] },
        { id: "farewell", title: "متنقلة التوديع", fridayOnly: false, zones: [] },
        { id: "garage", title: "متنقلة گراج ابوتراب", fridayOnly: true, zones: [] },
        { id: "murtada", title: "استراحة المرتضى", fridayOnly: true, zones: [] },
        { id: "ridha", title: "صحيات مدينة امام الرضا عليه السلام", fridayOnly: false, zones: [] }
      ];
      const person = (id, name, rest, site, zoneId, note) => ({
        id, name, rest, site, zone: zoneId || "", note: note || "", leave: false
      });
      const people = [
        person("p1", "عبد الهادي صادق", "tue", "s4", "s4a"),
        person("p2", "هاني عوده", "mon", "s4", "s4c"),
        person("p3", "علي احمد", "thu", "s4", "s4b"),
        person("p4", "محمد رضا", "tue", "s4", "s4d"),
        person("p5", "ريسان عبد", "mon", "s4", "s4c", "أحواض الوضوء باب الامام الحسين(ع)"),
        person("p6", "رضا عبد مسلم", "sat", "s5", "s5a"),
        person("p7", "احمد عدنان", "mon", "s5", "s5c", "صحيات جامع الشيخ الانصاري"),
        person("p8", "صاحب مهدي", "sat", "s5", "s5b"),
        person("p9", "عباس جبار", "thu", "s5", "s5c"),

    let state = load();

    function load() {
      try {

        if (saved && Array.isArray(saved.people) && Array.isArray(saved.sites)) {
          saved.daily = saved.daily && typeof saved.daily === "object" ? saved.daily : {};
          saved.sites.forEach((site) => { site.zones = Array.isArray(site.zones) ? site.zones : []; });
          saved.people.forEach((person) => {

          return saved;
        }
      } catch (err) { /* الأصل */ }
      return seed();

    function save() { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
    function todayISO() {
      const d = new Date();
      const z = (n) => String(n).padStart(2, "0");
      return d.getFullYear() + "-" + z(d.getMonth() + 1) + "-" + z(d.getDate());
    }
    function toISO(date) {
      const z = (n) => String(n).padStart(2, "0");
      return date.getFullYear() + "-" + z(date.getMonth() + 1) + "-" + z(date.getDate());
    }
    function parseISO(dateISO) {
      const parts = String(dateISO || "").split("-").map(Number);
      if (parts.length !== 3 || parts.some((n) => !Number.isFinite(n))) return new Date();
      return new Date(parts[0], parts[1] - 1, parts[2]);
    }
    function weekdayId(dateISO) {
      return ["sun", "mon", "tue", "wed", "thu", "fri", "sat"][parseISO(dateISO).getDay()];
    }
    function shiftDate(iso, days) {
      const dt = parseISO(iso);
      dt.setDate(dt.getDate() + days);
      return toISO(dt);
    }
    function weekStartISO(dateISO) {
      const dt = parseISO(dateISO);
      const sinceSat = (dt.getDay() + 1) % 7;
      dt.setDate(dt.getDate() - sinceSat);
      return toISO(dt);
    }
    function weekDates(dateISO) {
      const start = weekStartISO(dateISO);
      return [0, 1, 2, 3, 4, 5, 6].map((n) => shiftDate(start, n));
    }
    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[ch]);
    }
    function siteById(id) { return state.sites.find((s) => s.id === id); }
    function personById(id) { return state.people.find((p) => p.id === id); }
    function nextId(prefix, list) {
      const nums = list.map((item) => Number(String(item.id).replace(/\D/g, "")) || 0);
      return prefix + (Math.max(0, ...nums) + 1);
    }
    function nameTaken(name, exceptId) {
      const key = name.trim();
      return state.people.some((person) => person.id !== exceptId && person.name.trim() === key);
    }
    function byName(a, b) { return a.name.localeCompare(b.name, "ar"); }
    function dayOptions(selected) {
      const head = `<option value=""${!selected ? " selected" : ""}>بلا استراحة</option>`;
      return head + DAYS.map((d) => `<option value="${d.id}"${d.id === selected ? " selected" : ""}>${d.name}</option>`).join("");
    }
    function openSitesFor(dateISO) {
      const day = weekdayId(dateISO);

    }
    function siteOptions(selected, openOnlyDay) {
      const sites = state.sites.filter((s) => !openOnlyDay || !s.fridayOnly || openOnlyDay === "fri");
      return `<option value="">بانتظار موقع</option>` + sites.map((s) =>

    }
    function siteOptionsForMove(personId, selected, dateISO) {
      const used = sitesUsedInWeek(personId, dateISO);
      const sites = openSitesFor(dateISO).filter((site) => site.id === selected || !used.has(site.id));
      const options = sites.map((s) =>
        `<option value="${esc(s.id)}"${s.id === selected ? " selected" : ""}>${esc(s.title)}</option>`
      ).join("");
      const waiting = `<option value=""${!selected ? " selected" : ""}>بانتظار موقع</option>`;
      return waiting + options;
    }
    function isOff(person, dateISO) {
      const day = weekdayId(dateISO);
      return Boolean(person.leave || person.rest === day);
    }
    function uniquePeople(list) {
      const seen = new Set();
      return list.filter((person) => {
        if (!person || !person.id || seen.has(person.id)) return false;
        seen.add(person.id);
        return true;
      });
    }
    function assignmentFor(dateISO, person) {
      const override = state.daily[dateISO] && state.daily[dateISO][person.id];
      if (override) return { siteId: override.siteId || "", zoneId: override.zoneId || "" };
      const openIds = new Set(openSitesFor(dateISO).map((s) => s.id));
      if (person.site && openIds.has(person.site)) return { siteId: person.site, zoneId: person.zone || "" };
      return { siteId: "", zoneId: "" };
    }
    function classify(dateISO) {
      const day = weekdayId(dateISO);
      const openSites = openSitesFor(dateISO);
      const openIds = new Set(openSites.map((s) => s.id));
      const bySite = new Map(openSites.map((s) => [s.id, []]));
      const rest = [];
      const leave = [];
      const waiting = [];
      uniquePeople(state.people).forEach((person) => {
        if (person.leave) { leave.push(person); return; }
        if (person.rest === day) { rest.push(person); return; }
        const { siteId, zoneId } = assignmentFor(dateISO, person);
        if (!siteId || !openIds.has(siteId)) { waiting.push(person); return; }
        bySite.get(siteId).push({ person, zoneId });
      });
      bySite.forEach((rows) => rows.sort((a, b) => byName(a.person, b.person)));
      rest.sort(byName);
      leave.sort(byName);
      waiting.sort(byName);
      return { day, openSites, bySite, rest, leave, waiting };
    }
    function hashPick(seed, mod) {
      let h = 2166136261;
      for (let i = 0; i < seed.length; i += 1) {
        h ^= seed.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return Math.abs(h) % Math.max(mod, 1);
    }
    function sitesUsedInWeek(personId, dateISO) {
      const used = new Set();
      weekDates(dateISO).forEach((dayISO) => {
        if (dayISO === dateISO) return;
        const person = personById(personId);
        if (!person || isOff(person, dayISO)) return;
        const siteId = assignmentFor(dayISO, person).siteId;
        if (siteId) used.add(siteId);
      });
      return used;
    }
    function yesterdaySite(personId, dateISO) {
      const prev = shiftDate(dateISO, -1);
      if (weekStartISO(prev) !== weekStartISO(dateISO)) return "";
      const person = personById(personId);
      if (!person || isOff(person, prev)) return "";
      return assignmentFor(prev, person).siteId || "";
    }
    function redistributeDay(dateISO) {
      const openSites = openSitesFor(dateISO);
      if (!openSites.length) {
        state.daily[dateISO] = {};
        save();
        return;
      }
      const available = uniquePeople(state.people).filter((person) => !isOff(person, dateISO));
      const load = Object.fromEntries(openSites.map((site) => [site.id, 0]));
      const nextDaily = {};
      const ordered = available.slice().sort((a, b) => {
        const ha = hashPick(dateISO + a.id, 100000);
        const hb = hashPick(dateISO + b.id, 100000);
        return ha - hb || byName(a, b);
      });
      ordered.forEach((person) => {
        const used = sitesUsedInWeek(person.id, dateISO);
        const ySite = yesterdaySite(person.id, dateISO);
        let candidates = openSites.filter((site) => !used.has(site.id));
        if (!candidates.length) candidates = openSites.slice();
        const fresh = candidates.filter((site) => site.id !== ySite);
        if (fresh.length) candidates = fresh;
        candidates.sort((a, b) => {
          const la = load[a.id] - load[b.id];
          if (la) return la;
          return hashPick(dateISO + person.id + a.id, 1000) - hashPick(dateISO + person.id + b.id, 1000);
        });
        const chosen = candidates[0];
        if (!chosen) return;
        load[chosen.id] += 1;
        const zoneOk = chosen.id === person.site && chosen.zones.some((zone) => zone.id === person.zone);
        nextDaily[person.id] = { siteId: chosen.id, zoneId: zoneOk ? person.zone : "" };
      });
      state.daily[dateISO] = nextDaily;
      save();
    }
    function ensureDayPlan(dateISO) {
      if (!state.daily[dateISO] || !Object.keys(state.daily[dateISO]).length) redistributeDay(dateISO);
    }
    function buildReport(dateISO) {
      const view = classify(dateISO);
      const lines = [
        "*بسم الله الرحمن الرحيم*",
        "*خطه عمل خدام الوحده الصباحية شعبة المنشآت الصحية*",
        "*... يوم " + DAY_NAME[view.day] + " " + dateISO.split("-").join("/") + " ...*",
        ""
      ];
      view.openSites.forEach((site) => {
        const rows = view.bySite.get(site.id) || [];
        if (!rows.length) return;
        lines.push("*" + site.title + "*");
        rows.forEach((row, index) => {
          lines.push((index + 1) + "-" + row.person.name + (row.person.note ? " … " + row.person.note : ""));
        });
        lines.push("");
      });
      if (view.waiting.length) {
        lines.push("*بانتظار تحديد موقع*");
        view.waiting.forEach((person, index) => lines.push((index + 1) + "-" + person.name));
        lines.push("");
      }
      const detailed = view.openSites.filter((site) => site.zones.length && (view.bySite.get(site.id) || []).some((row) => row.zoneId));
      if (detailed.length) {
        lines.push("*خطه توزيع المهام على المنتسبين*");
        lines.push("");
        detailed.forEach((site) => {
          lines.push("*" + site.title + "*");
          const rows = view.bySite.get(site.id) || [];
          site.zones.forEach((zone) => {
            const names = rows.filter((row) => row.zoneId === zone.id).map((row) => row.person.name);
            if (!names.length) return;
            lines.push("*" + zone.label + "*");
            lines.push(names.join(" + "));
          });
          lines.push("");
        });
      }
      return lines.join("\n").trim() + "\n";
    }

      if (!reportDirty) setReport(buildReport(dateISO), false);

      const button = document.getElementById("copy-report");
      const msg = document.getElementById("copy-msg");
      try {
        await navigator.clipboard.writeText(document.getElementById("report").value);
        button.classList.add("done");
        button.textContent = "تم";
        msg.textContent = "جاهز للصق في الواتساب.";
        setTimeout(() => { button.classList.remove("done"); button.textContent = "نسخ"; }, 1400);
      } catch (err) {
        document.getElementById("report").focus();
        document.getElementById("report").select();
        msg.textContent = "حدّد النص وانسخه يدوياً.";
      }
    });
    document.getElementById("reset-seed").addEventListener("click", (event) => {
      if (!wantsConfirm(event.currentTarget, "تأكيد؟")) return;
      state = seed();
      reportDirty = false;
      peopleQuery = "";
      boardQuery = "";
      document.getElementById("people-filter").value = "";
      document.getElementById("board-filter").value = "";
      save();
      applyDate(dateInput.value || todayISO(), { forceRedistribute: true, message: "رجعت الخطة الأصلية." });
      event.currentTarget.textContent = "الأصل";
    });

    document.getElementById("people-filter").addEventListener("input", (event) => {
      peopleQuery = event.target.value;
      const start = event.target.selectionStart;
      paintPeople();
      const filter = document.getElementById("people-filter");
      filter.value = peopleQuery;
      filter.focus();
      filter.setSelectionRange(start, start);
    });
    document.getElementById("add-person").addEventListener("submit", (event) => {
      event.preventDefault();
      const form = event.target;
      const error = document.getElementById("add-error");
      const name = form.name.value.trim();
      if (!name) { error.hidden = false; error.textContent = "اكتب الاسم."; return; }
      if (nameTaken(name)) { error.hidden = false; error.textContent = "الاسم موجود."; return; }
      error.hidden = true;
      state.people.push({
        id: nextId("p", state.people),
        name,
        rest: form.rest.value,
        site: form.site.value,
        zone: "",
        note: "",
        leave: false
      });
      form.reset();
      form.querySelector("select[name=rest]").innerHTML = dayOptions("");
      save();
      refreshAll();
    });
    document.getElementById("people-list").addEventListener("change", (event) => {
      const form = event.target.closest("form[data-person]");
      if (form) commitPeopleForm(form);
    });
    document.getElementById("people-list").addEventListener("focusout", (event) => {
      const form = event.target.closest("form[data-person]");
      if (form && (event.target.name === "name" || event.target.name === "note")) commitPeopleForm(form);
    });
    document.getElementById("people-list").addEventListener("click", (event) => {
      const button = event.target.closest("[data-delete-person]");
      if (!button || !wantsConfirm(button, "تأكيد؟")) return;
      const pid = button.dataset.deletePerson;
      state.people = state.people.filter((item) => item.id !== pid);
      Object.keys(state.daily).forEach((day) => {
        if (state.daily[day] && state.daily[day][pid]) delete state.daily[day][pid];
      });
      save();
      refreshAll();
    });

    document.getElementById("add-site").addEventListener("submit", (event) => {
      event.preventDefault();
      const form = event.target;
      const error = document.getElementById("site-error");
      const title = form.title.value.trim();
      if (!title) { error.hidden = false; error.textContent = "اكتب اسم الموقع."; return; }
      error.hidden = true;
      state.sites.push({
        id: nextId("s", state.sites),
        title,
        fridayOnly: form.fridayOnly.checked,
        zones: []
      });
      form.reset();
      save();
      refreshAll();
    });
    document.getElementById("sites-list").addEventListener("change", (event) => {
      const form = event.target.closest("form[data-site]");
      if (!form) return;
      const site = siteById(form.dataset.site);
      if (!site) return;
      if (event.target.name === "title") site.title = form.title.value.trim() || site.title;
      if (event.target.name === "fridayOnly") site.fridayOnly = form.fridayOnly.checked;
      save();
      paintBoard();
    });
    document.getElementById("sites-list").addEventListener("focusout", (event) => {
      const input = event.target.closest("[data-zone-label]");
      if (!input) return;
      const site = siteById(input.dataset.zoneLabel);
      const zone = site && site.zones.find((item) => item.id === input.dataset.zone);
      if (!zone) return;
      zone.label = input.value.trim() || zone.label;
      input.value = zone.label;
      save();
      paintBoard();
    });
    document.getElementById("sites-list").addEventListener("click", (event) => {
      const add = event.target.closest("[data-add-zone]");
      if (add) {
        const site = siteById(add.dataset.addZone);
        if (!site) return;
        site.zones = site.zones || [];
        site.zones.push({ id: nextId(site.id + "z", site.zones), label: "تفصيلة جديدة" });
        save();
        refreshAll();
        return;
      }
      const zoneButton = event.target.closest("[data-delete-zone]");
      if (zoneButton) {
        if (!wantsConfirm(zoneButton, "تأكيد؟")) return;
        const site = siteById(zoneButton.dataset.deleteZone);
        if (!site) return;
        site.zones = site.zones.filter((zone) => zone.id !== zoneButton.dataset.zone);
        state.people.forEach((person) => {
          if (person.zone === zoneButton.dataset.zone) person.zone = "";
        });
        save();
        refreshAll();
        return;
      }
      const siteButton = event.target.closest("[data-delete-site]");
      if (!siteButton || !wantsConfirm(siteButton, "تأكيد؟")) return;
      const site = siteById(siteButton.dataset.deleteSite);
      if (!site) return;
      state.sites = state.sites.filter((item) => item.id !== site.id);
      state.people.forEach((person) => {
        if (person.site === site.id) { person.site = ""; person.zone = ""; }
      });
      Object.keys(state.daily).forEach((day) => {
        Object.keys(state.daily[day] || {}).forEach((pid) => {
          if (state.daily[day][pid].siteId === site.id) state.daily[day][pid] = { siteId: "", zoneId: "" };
        });
      });
      save();
      refreshAll();
    });
    document.addEventListener("click", (event) => {
      if (!armed || event.target === armed.button) return;
      armed.button.textContent = armed.label;
      armed = null;
    });

    ensureDayPlan(dateInput.value);
    refreshAll();
    window.__khadam = {
      classify,
      buildReport,
      redistributeDay,
      sitesUsedInWeek,
      weekStartISO,
      shiftDate,
      STORE_KEY,
      getState: () => state
    };
  </script>
</body>
</html>
